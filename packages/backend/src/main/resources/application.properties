# Application
spring.application.name=digital-wallet
spring.profiles.active=dev

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.clean-disabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=300
logging.level.org.hibernate.SQL_SLOW=INFO

# Jackson – serialize Instant as ISO-8601 string (e.g. 2026-05-19T10:00:00Z)
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
jwt.expiration=900000
jwt.refresh-expiration=604800000
jwt.issuer=digital-wallet-api
jwt.audience=digital-wallet-client

# Server Configuration
server.port=8080

# Java 21 Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

