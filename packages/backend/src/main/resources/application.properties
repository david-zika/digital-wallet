# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/digital_wallet
spring.datasource.username=postgres
spring.datasource.password=root
# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.clean-disabled=true
# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# JWT Configuration
jwt.secret=your-secret-key-here-should-be-very-long-and-secure
jwt.expiration=86400000
# Server Configuration
server.port=8080
# Java 21 Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true
# Application mode: true = demo (instantly completes external transactions), false = production
app.demo-mode=true
# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:5173
