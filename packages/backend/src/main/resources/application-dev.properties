# Development profile – local defaults, never commit real secrets to production
# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/digital_wallet
spring.datasource.username=postgres
spring.datasource.password=root
# JWT secret – replace with a random 64+ char value even in dev
jwt.secret=dev-secret-key-change-before-any-deployment-minimum-64-chars-long-x
# App
app.demo-mode=true
app.cors-allowed-origins=http://localhost:5173
app.trusted-proxy=false
# Show SQL in dev
logging.level.org.hibernate.SQL=DEBUG
# Redis (local – started via docker-compose)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Flyway – include seed data only in development
spring.flyway.locations=classpath:db/migrations,classpath:db/seeds
