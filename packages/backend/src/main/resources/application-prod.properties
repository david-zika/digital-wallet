# Production profile – all values must be supplied via environment variables.
# Never hardcode secrets here.

# Database  (set: SPRING_DATASOURCE_URL / USERNAME / PASSWORD)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JWT secret – minimum 64 cryptographically random characters (set: JWT_SECRET)
jwt.secret=${JWT_SECRET}

# App
app.demo-mode=false
app.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.trusted-proxy=true

# Redis (set: SPRING_DATA_REDIS_HOST, optionally SPRING_DATA_REDIS_PORT / PASSWORD)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# Flyway – baseline-on-migrate must be false in prod (schema must already exist or be clean)
spring.flyway.baseline-on-migrate=false

# Actuator – expose only on internal management port (not reachable from public internet)
management.server.port=8081
management.server.address=127.0.0.1

